services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerwise-db
    environment:
      POSTGRES_DB: ledgerwise
      POSTGRES_USER: ledgerwise
      POSTGRES_PASSWORD: ledgerwise
    ports:
      - "5432:5432"
    volumes:
      - ledgerwise_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerwise -d ledgerwise"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ledgerwise_data:
