<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add transaction · LedgerWise</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><div th:replace="~{fragments :: nav}"></div><main><div class="page-heading"><div><p class="eyebrow">KEEP YOUR LEDGER CURRENT</p><h1>Add transaction</h1><p class="muted">Capture the details while they're fresh.</p></div></div><section class="panel form-panel"><form th:action="@{/transactions}" th:object="${transaction}" method="post" class="form-grid"><div class="field full"><label>Description</label><input type="text" th:field="*{description}" placeholder="e.g. Groceries at the supermarket"><small class="error" th:errors="*{description}"></small></div><div class="field"><label>Amount (₹)</label><input type="number" step="0.01" min="0.01" th:field="*{amount}" placeholder="0.00"><small class="error" th:errors="*{amount}"></small></div><div class="field"><label>Type</label><select th:field="*{type}"><option th:each="type : ${types}" th:value="${type}" th:text="${type}"></option></select><small class="error" th:errors="*{type}"></small></div><div class="field"><label>Category</label><select th:field="*{category}"><option value="">Choose a category</option><option th:each="category : ${categories}" th:value="${category}" th:text="${category.label}"></option></select><small class="error" th:errors="*{category}"></small></div><div class="field"><label>Date</label><input type="date" th:field="*{transactionDate}"><small class="error" th:errors="*{transactionDate}"></small></div><div class="field full"><label>Notes <span class="muted">(optional)</span></label><textarea rows="3" th:field="*{notes}" placeholder="Add a little context..."></textarea><small class="error" th:errors="*{notes}"></small></div><div class="form-actions full"><a class="button button-light" th:href="@{/transactions}">Cancel</a><button class="button">Save transaction</button></div></form></section></main><footer>LedgerWise <span>Spend with intention.</span></footer></div></body></html>
