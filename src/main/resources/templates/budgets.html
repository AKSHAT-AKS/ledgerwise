<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budgets · LedgerWise</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><div th:replace="~{fragments :: nav}"></div><main><div th:replace="~{fragments :: flash}"></div><div class="page-heading"><div><p class="eyebrow">PLAN AHEAD</p><h1>Monthly budgets</h1><p class="muted">Set category limits and keep spending in check.</p></div><form method="get" class="month-picker"><label for="month">Month</label><input id="month" type="month" name="month" th:value="${month}"><button class="button button-light">View</button></form></div><div class="content-grid"><section class="panel"><div class="panel-heading"><div><h2>Set a category limit</h2><p class="muted">Saving the same category again updates its limit.</p></div></div><form th:action="@{/budgets}" th:object="${budget}" method="post" class="form-grid"><div class="field full"><label>Month</label><input type="month" th:field="*{monthKey}"><small class="error" th:errors="*{monthKey}"></small></div><div class="field full"><label>Category</label><select th:field="*{category}"><option value="">Choose a category</option><option th:each="category : ${categories}" th:value="${category}" th:text="${category.label}"></option></select><small class="error" th:errors="*{category}"></small></div><div class="field full"><label>Limit (₹)</label><input type="number" step="0.01" min="0.01" th:field="*{limitAmount}" placeholder="e.g. 5000"><small class="error" th:errors="*{limitAmount}"></small></div><button class="button full">Save budget</button></form></section><section class="panel"><div class="panel-heading"><div><h2>Budgets for <span th:text="${month}">month</span></h2><p class="muted">Your configured limits</p></div></div><div class="empty-state" th:if="${#lists.isEmpty(budgets)}"><p>No budgets configured for this month yet.</p></div><div class="budget-list" th:each="b : ${budgets}"><div class="budget-top"><strong th:text="${b.category.label}">Food</strong><span th:text="'₹ ' + ${#numbers.formatDecimal(b.limitAmount,1,2)}">₹ 0</span></div></div></section></div></main><footer>LedgerWise <span>Spend with intention.</span></footer></div></body></html>
