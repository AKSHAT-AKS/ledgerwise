<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transactions · LedgerWise</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="shell"><div th:replace="~{fragments :: nav}"></div><main><div th:replace="~{fragments :: flash}"></div><div class="page-heading"><div><p class="eyebrow">MONEY MOVEMENT</p><h1>Transactions</h1><p class="muted">Every income and expense, in one place.</p></div><a class="button" th:href="@{/transactions/new}">+ Add transaction</a></div><form method="get" th:action="@{/transactions}" class="filter-bar">
<div class="field"><label for="q">Search</label><input id="q" type="search" name="q" placeholder="Description or notes" th:value="${query}"></div>
<div class="field"><label for="type">Type</label><select id="type" name="type"><option value="">All transactions</option><option th:each="option : ${types}" th:value="${option}" th:text="${option}" th:selected="${option == selectedType}"></option></select></div>
<button class="button button-light" type="submit">Filter</button><a class="text-link" th:href="@{/transactions}">Clear</a>
</form><section class="panel"><div class="empty-state" th:if="${#lists.isEmpty(transactions)}"><h3>Your ledger is empty</h3><p>Record your first transaction to see it here.</p><a class="button" th:href="@{/transactions/new}">Add transaction</a></div><div class="table-wrap" th:unless="${#lists.isEmpty(transactions)}"><table><thead><tr><th>DESCRIPTION</th><th>TYPE</th><th>CATEGORY</th><th>DATE</th><th class="align-right">AMOUNT</th><th></th></tr></thead><tbody><tr th:each="t : ${transactions}"><td><strong th:text="${t.description}">Description</strong><small th:text="${t.notes}"></small></td><td><span class="tag" th:text="${t.type}">EXPENSE</span></td><td th:text="${t.category.label}">Food</td><td th:text="${#temporals.format(t.transactionDate,'dd MMM yyyy')}">Date</td><td class="align-right amount" th:classappend="${t.type.name() == 'INCOME'} ? ' positive' : ' negative'" th:text="(${t.type.name() == 'INCOME'} ? '+ ' : '− ') + '₹ ' + ${#numbers.formatDecimal(t.amount,1,2)}">₹ 0</td><td><a class="text-link" th:href="@{/transactions/{id}/edit(id=${t.id})}">Edit</a> <form th:action="@{/transactions/{id}/delete(id=${t.id})}" method="post" onsubmit="return confirm('Delete this transaction?')"><button class="icon-button" title="Delete">×</button></form></td></tr></tbody></table></div></section></main><footer>LedgerWise <span>Spend with intention.</span></footer></div></body></html>
